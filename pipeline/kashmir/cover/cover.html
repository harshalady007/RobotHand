<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2);font-weight:900}
@font-face{font-family:M;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:M;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#000;overflow:hidden}
.c{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:M,sans-serif}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(var(--z,1.06));transform-origin:var(--o,50% 40%);filter:saturate(1.12) contrast(1.04)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 48%,rgba(0,0,0,.55) 62%,rgba(0,0,0,.88) 82%,rgba(0,0,0,.94) 100%)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 50%,rgba(0,0,0,.35) 100%)}
.top{position:absolute;top:262px;left:72px;display:flex;align-items:center;gap:22px}
.logo{width:112px;height:112px;border-radius:50%;background:url(coverimg/logo.png) center/104% no-repeat;box-shadow:0 0 0 4px #f2e3c4,0 8px 24px rgba(0,0,0,.6)}
.brand{color:#f2e3c4;font-weight:800;font-size:34px;letter-spacing:.18em;line-height:1.15;text-shadow:0 3px 10px rgba(0,0,0,.8)}
.brand small{display:block;font-size:24px;letter-spacing:.32em;color:#ffd23f;font-weight:700}
.title{position:absolute;left:64px;right:64px;top:var(--tt,1010px)}
.l{display:block;color:#fff;font-weight:900;font-size:var(--fs,156px);line-height:.96;letter-spacing:-.01em;text-transform:uppercase;-webkit-text-stroke:7px #000;paint-order:stroke fill;text-shadow:0 10px 0 rgba(0,0,0,.55),0 18px 40px rgba(0,0,0,.7)}
.box{display:inline-block;margin-top:22px;margin-left:6px;padding:6px 34px 16px;background:var(--acc);color:#fff;font-weight:900;font-size:var(--bs,166px);line-height:1;text-transform:uppercase;transform:rotate(-3deg);border:8px solid #000;box-shadow:12px 14px 0 #000}
.cta{position:absolute;left:0;right:0;bottom:262px;text-align:center;color:#fff;font-weight:800;font-size:38px;letter-spacing:.2em;text-shadow:0 3px 12px #000}
.cta span{display:inline-block;margin-left:14px;width:0;height:0;border-left:26px solid var(--acc);border-top:16px solid transparent;border-bottom:16px solid transparent;vertical-align:-4px}
.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
.safe{position:absolute;left:0;right:0;top:240px;height:1440px;outline:4px dashed rgba(0,255,0,.7);display:none}
</style></head><body><div id="root"></div>
<script>
const q=new URLSearchParams(location.search);const img=q.get('img')||'coverimg/hero.png', safe=q.get('safe'), acc=q.get('acc')||'#ff4a3a', tt=q.get('tt')||'1010', z=q.get('z')||'1.04', o=q.get('o')||'50% 40%';
document.getElementById('root').innerHTML=`<div class="c" style="--acc:${acc};--z:${z};--o:${o};--tt:${tt}px">
 <div class="bg" style="background-image:url(${img})"></div><div class="vig"></div><div class="shade"></div>
 <div class="top"><div class="logo"></div><div class="brand">REDRAWN<small>STORIES</small></div></div>
 <div class="title"><span class="l">Why</span><span class="l">Kashmir</span><span class="box">Matters</span></div>
 <div class="cta">WATCH TILL THE END<span></span></div>
 <div class="grain"></div>${safe?'<div class="safe" style="display:block"></div>':''}</div>`;
document.fonts.ready.then(()=>{window.ready=true});
</script></body></html>
